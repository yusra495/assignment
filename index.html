
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - Responsive Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #222;
}

/* Header */
header {
    background: #172554;
    color: white;
    padding: 18px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    color: #facc15;
    font-size: 26px;
}

nav {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
}

nav a:hover {
    color: #facc15;
}

/* Hero section */
.hero {
    text-align: center;
    padding: 75px 20px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
}

.hero h2 {
    font-size: clamp(28px, 5vw, 46px);
    margin-bottom: 15px;
}

.hero p {
    margin-bottom: 25px;
    line-height: 1.6;
}

.shop-btn {
    display: inline-block;
    background: #facc15;
    color: #172554;
    padding: 13px 25px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
}

/* Products */
.products {
    width: min(1200px, 90%);
    margin: 45px auto;
}

.products h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 30px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 22px;
}

.product-card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 4px 12px #00000010;
    transition: transform 0.2s;
    min-width: 0;
}

.product-card:hover {
    transform: translateY(-5px);
}

.product-card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
}

.product-card h3 {
    font-size: 17px;
    margin: 12px 0;
}

.price {
    color: #2563eb;
    font-weight: bold;
    font-size: 19px;
    margin-bottom: 15px;
}

button {
    background: #172554;
    color: white;
    border: none;
    padding: 12px 14px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
}

button:hover {
    background: #2563eb;
}

/* Cart */
.cart {
    width: min(1100px, 90%);
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}

.cart h2 {
    margin-bottom: 18px;
}

.cart-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
}

.cart-row span {
    overflow-wrap: anywhere;
}

.remove-btn {
    width: auto;
    background: #dc2626;
    flex-shrink: 0;
}

.total {
    font-size: 21px;
    font-weight: bold;
    margin: 22px 0;
}

/* Footer */
footer {
    text-align: center;
    background: #172554;
    color: white;
    padding: 22px;
}

/* Tablets */
@media (max-width: 900px) {
    .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    header {
        padding: 18px 4%;
    }

    .product-card img {
        height: 170px;
    }
}

/* Mobile phones */
@media (max-width: 600px) {
    header {
        flex-direction: column;
        text-align: center;
    }

    nav {
        justify-content: center;
        gap: 15px;
    }

    .hero {
        padding: 55px 18px;
    }

    .products {
        width: 94%;
        margin: 30px auto;
    }

    .products h2 {
        font-size: 25px;
    }

    .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .product-card {
        padding: 10px;
    }

    .product-card img {
        height: 125px;
    }

    .product-card h3 {
        font-size: 14px;
    }

    .price {
        font-size: 16px;
    }

    .product-card button {
        padding: 10px 5px;
        font-size: 12px;
    }

    .cart {
        width: 94%;
        padding: 16px;
    }

    .cart-row {
        align-items: flex-start;
    }

    .remove-btn {
        padding: 8px;
        font-size: 12px;
    }
}

/* Very small phones */
@media (max-width: 360px) {
    .product-grid {
        grid-template-columns: 1fr;
    }

    .product-card img {
        height: 190px;
    }
}
</style>
</head>

<body>

<header>
    <h1 class="logo">ShopEase</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#cart">Cart (<span id="count">0</span>)</a>
    </nav>
</header>

<section class="hero" id="home">
    <h2>Shop Your Favorite Products</h2>
    <p>Discover quality products at amazing prices.</p>
    <a href="#products" class="shop-btn">Shop Now</a>
</section>

<section class="products" id="products">
    <h2>Our Products</h2>

    <div class="product-grid" id="product-grid"></div>
</section>

<section class="cart" id="cart">
    <h2>🛒 Shopping Cart</h2>
    <div id="cart-items">Your cart is empty.</div>
    <p class="total">Total: Rs. <span id="total">0</span></p>
    <button onclick="checkout()">Proceed to Checkout</button>
</section>

<footer>
    <p>&copy; 2026 ShopEase. All rights reserved.</p>
</footer>

<script>
const products = [
    {
        name: "Headphones",
        price: 3500,
        image: "https://placehold.co/300x200/e0e7ff/172554?text=Headphones"
    },
    {
        name: "Smart Watch",
        price: 5000,
        image: "https://placehold.co/300x200/fef3c7/92400e?text=Watch"
    },
    {
        name: "Sports Shoes",
        price: 4000,
        image: "https://placehold.co/300x200/dcfce7/166534?text=Shoes"
    },
    {
        name: "Backpack",
        price: 2000,
        image: "https://placehold.co/300x200/fce7f3/9d174d?text=Backpack"
    }
];

let cart = [];

const productGrid = document.getElementById("product-grid");

products.forEach((product, index) => {
    const card = document.createElement("article");
    card.className = "product-card";

    const img = document.createElement("img");
    img.src = product.image;
    img.alt = product.name;
    img.loading = "lazy";

    const title = document.createElement("h3");
    title.textContent = product.name;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = "Rs. " + product.price.toLocaleString("en-PK");

    const btn = document.createElement("button");
    btn.textContent = "Add to Cart";
    btn.addEventListener("click", () => addToCart(index));

    card.append(img, title, price, btn);
    productGrid.appendChild(card);
});

function addToCart(index) {
    const product = products[index];
    const item = cart.find(p => p.name === product.name);

    if (item) {
        item.quantity++;
    } else {
        cart.push({
            name: product.name,
            price: product.price,
            quantity: 1
        });
    }

    updateCart();
}

function removeFromCart(name) {
    cart = cart.filter(item => item.name !== name);
    updateCart();
}

function updateCart() {
    const container = document.getElementById("cart-items");
    container.replaceChildren();

    let total = 0;
    let count = 0;

    if (cart.length === 0) {
        container.textContent = "Your cart is empty.";
    }

    cart.forEach(item => {
        total += item.price * item.quantity;
        count += item.quantity;

        const row = document.createElement("div");
        row.className = "cart-row";

        const details = document.createElement("span");
        details.textContent =
            `${item.name} x ${item.quantity} — Rs. ${(item.price * item.quantity).toLocaleString("en-PK")}`;

        const btn = document.createElement("button");
        btn.className = "remove-btn";
        btn.textContent = "Remove";
        btn.addEventListener("click", () => removeFromCart(item.name));

        row.append(details, btn);
        container.appendChild(row);
    });

    document.getElementById("total").textContent =
        total.toLocaleString("en-PK");

    document.getElementById("count").textContent = count;
}

function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    alert("Demo checkout only. A backend is required for real orders.");
}
</script>

</body>
</html>
